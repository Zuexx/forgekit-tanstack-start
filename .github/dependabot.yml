version: 2

# Monthly and grouped: this is a starter that products fork and then upgrade on their own
# schedule, so keeping every patch current here buys little and costs a PR stream.
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Majors held until the toolchain supports them. typescript-eslint does not support
      # TypeScript 7 yet (CI fails at lint); ESLint 10 moves with it. Revisit both together.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Must stay on the major Microsoft.AspNetCore.OpenApi is built against; it moves with
      # the .NET 11 upgrade (#94). See the comment in api/Directory.Packages.props.
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]
    groups:
      # Minors and patches in one PR; a major still arrives on its own for review.
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
